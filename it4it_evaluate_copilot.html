    <strong>Loading IT4IT Evaluate Copilot...</strong>
    <span>正在装载页面资源，请稍候。</span>
  </div>
  <script>
    (function () {
      var parts = window.__it4itB64 || [];
      var b64 = parts.join("");
      var binary = atob(b64);
      var bytes = Uint8Array.from(binary, function (char) { return char.charCodeAt(0); });
      var html = new TextDecoder().decode(bytes);
      document.open();
      document.write(html);
      document.close();
    })();
  </script>
